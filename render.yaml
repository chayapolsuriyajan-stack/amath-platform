services:
  - type: web
    name: amath-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    # where games are saved so they survive a restart; see the README. Render asks for these
    # values when the service is created from this file, and never stores them in git.
    envVars:
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
